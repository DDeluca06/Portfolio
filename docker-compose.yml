services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resufolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_ADMIN_TOKEN}
      - INFLUX_ORG=homelab
      - INFLUX_BUCKET=metrics
      - DOCKER_HOST=tcp://docker-proxy:2375
      - STATS_API_KEY=${STATS_API_KEY}
      - STATS_API_URL=http://stats-api:3001
    networks:
      - web
      - backend
      - docker-proxy
    depends_on:
      influxdb:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.routers.portfolio.tls.certresolver=le"
      - "traefik.http.services.portfolio.loadbalancer.server.port=3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:3000');process.exit(r.ok?0:1)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  influxdb:
    image: influxdb:2.7-alpine
    container_name: resufolio-influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_ADMIN_TOKEN}
      - DOCKER_INFLUXDB_INIT_ORG=homelab
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./influxdb/retention:/docker-entrypoint-initdb.d
    networks:
      - backend
    ports:
      - "8086:8086"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Stats API - System metrics collection
  stats-api:
    build:
      context: ./services/stats-api
      dockerfile: Dockerfile
    container_name: resufolio-stats-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - STATS_API_KEY=${STATS_API_KEY}
      - SERVER_NAME=${SERVER_NAME:-Homelab Server}
    networks:
      - backend
      - web
    ports:
      - "3001:3001"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Docker Socket Proxy - Secure access to Docker API
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: resufolio-docker-proxy
    restart: unless-stopped
    environment:
      # Enable read-only access to resources
      - CONTAINERS=1
      - SERVICES=1
      - NODES=1
      - NETWORKS=1
      - TASKS=1
      - INFO=1
      - VERSION=1
      # Explicitly disable write operations for security
      - POST=0
      - DELETE=0
      - PUT=0
      - PATCH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - GRPC=0
      - IMAGES=0
      - PLUGINS=0
      - SECRETS=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    # Security: restrict to internal network only
    expose:
      - "2375"
    # No external ports exposed - only accessible via docker-proxy network
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

networks:
  web:
    external: true
  backend:
    driver: bridge
  docker-proxy:
    internal: true
    driver: bridge

volumes:
  influxdb-data:
    driver: local
